name: Reels do Instagram

# Publica os Reels de agenda.json quando a hora chega (o cron do GitHub pode atrasar alguns minutos).
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: reels
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Publicar o que estiver na hora
        env:
          META_IG_ACCESS_TOKEN: ${{ secrets.META_IG_ACCESS_TOKEN }}
        run: node scripts/publicar-agenda.mjs
      - name: Guardar a agenda
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "noplaynogames-bot"
            git config user.email "bot@users.noreply.github.com"
            git add -A
            git commit -m "agenda: Reels publicados"
            git push
          fi
